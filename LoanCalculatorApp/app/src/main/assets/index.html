<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Home Loan EMI Calculator</title>
    <style>
        :root {
            --primary: #667eea;
            --primary-dark: #5a67d8;
            --secondary: #764ba2;
            --success: #48bb78;
            --danger: #f56565;
            --dark: #1a237e;
            --gray-100: #f7fafc;
            --gray-300: #e2e8f0;
            --gray-600: #718096;
            --gray-700: #4a5568;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            min-height: 100vh;
            padding: 15px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 20px;
            padding-top: 10px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--dark);
            margin-bottom: 15px;
            padding-bottom: 8px;
            border-bottom: 2px solid var(--primary);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--gray-300);
            border-radius: 8px;
            font-size: 1rem;
            background: white;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--primary);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
        }

        .preview-section {
            display: none;
            margin-top: 20px;
        }

        .preview-section.active {
            display: block;
        }

        .preview-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .preview-item {
            background: var(--gray-100);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }

        .preview-item.highlight {
            grid-column: span 2;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            color: white;
        }

        .preview-item .value {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark);
        }

        .preview-item.highlight .value {
            font-size: 1.4rem;
            color: white;
        }

        .preview-item .label {
            font-size: 0.75rem;
            color: var(--gray-600);
            margin-top: 3px;
        }

        .preview-item.highlight .label {
            color: rgba(255,255,255,0.9);
        }

        .part-payment-row {
            background: #f8f9ff;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
        }

        .part-payment-header {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid var(--gray-300);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            padding: 15px;
            background: var(--dark);
            color: white;
            border-radius: 10px;
            text-align: center;
            display: none;
            z-index: 1000;
        }

        .toast.active {
            display: block;
            animation: slideUp 0.3s ease;
        }

        .toast.error {
            background: var(--danger);
        }

        .toast.success {
            background: var(--success);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏠 Home Loan EMI Calculator</h1>
    </div>

    <div class="card">
        <h2 class="section-title">💰 Loan Amounts</h2>
        <div class="form-group">
            <label>Land Loan Amount (Rs.)</label>
            <input type="number" id="land_loan" placeholder="e.g., 15000000">
        </div>
        <div class="form-group">
            <label>Construction Loan Amount (Rs.)</label>
            <input type="number" id="construction_loan" placeholder="e.g., 10000000">
        </div>
    </div>

    <div class="card">
        <h2 class="section-title">📅 Important Dates</h2>
        <div class="form-row">
            <div class="form-group">
                <label>Loan Start Date</label>
                <input type="month" id="loan_start_date">
            </div>
            <div class="form-group">
                <label>Construction Start</label>
                <input type="month" id="construction_start_date">
            </div>
        </div>
    </div>

    <div class="card">
        <h2 class="section-title">📊 EMI & Interest</h2>
        <div class="form-row">
            <div class="form-group">
                <label>Monthly EMI (Rs.)</label>
                <input type="number" id="emi_amount" placeholder="e.g., 300000">
            </div>
            <div class="form-group">
                <label>Interest Rate (%)</label>
                <input type="number" id="interest_rate" value="7.54" step="0.01">
            </div>
        </div>
    </div>

    <div class="card">
        <h2 class="section-title">💸 Part Payments</h2>
        
        <div class="part-payment-row">
            <div class="part-payment-header">Prepayment 1</div>
            <div class="form-row">
                <select id="pp_month_1">
                    <option value="">Select Month</option>
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
                <input type="number" id="pp_amount_1" placeholder="Amount">
            </div>
        </div>

        <div class="part-payment-row">
            <div class="part-payment-header">Prepayment 2</div>
            <div class="form-row">
                <select id="pp_month_2">
                    <option value="">Select Month</option>
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
                <input type="number" id="pp_amount_2" placeholder="Amount">
            </div>
        </div>

        <div class="part-payment-row">
            <div class="part-payment-header">Prepayment 3</div>
            <div class="form-row">
                <select id="pp_month_3">
                    <option value="">Select Month</option>
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
                <input type="number" id="pp_amount_3" placeholder="Amount">
            </div>
        </div>
    </div>

    <div class="card">
        <button class="btn btn-primary" onclick="calculateLoan()">📊 Calculate</button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Calculating...</p>
        </div>

        <div class="preview-section" id="previewSection">
            <h2 class="section-title">📈 Results</h2>
            <div class="preview-grid">
                <div class="preview-item highlight">
                    <div class="value" id="result_closure">-</div>
                    <div class="label">Loan Closure Date</div>
                </div>
                <div class="preview-item">
                    <div class="value" id="result_tenure">-</div>
                    <div class="label">Tenure</div>
                </div>
                <div class="preview-item">
                    <div class="value" id="result_principal">-</div>
                    <div class="label">Principal</div>
                </div>
                <div class="preview-item">
                    <div class="value" id="result_interest">-</div>
                    <div class="label">Interest</div>
                </div>
                <div class="preview-item">
                    <div class="value" id="result_total">-</div>
                    <div class="label">Total Paid</div>
                </div>
                <div class="preview-item">
                    <div class="value" id="result_prepay">-</div>
                    <div class="label">Prepayments</div>
                </div>
            </div>
            
            <button class="btn btn-success" onclick="generatePDF()">📄 Download PDF Report</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Store calculation results
        let calculationResult = null;

        const MONTH_MAP = {
            'January': 1, 'February': 2, 'March': 3, 'April': 4,
            'May': 5, 'June': 6, 'July': 7, 'August': 8,
            'September': 9, 'October': 10, 'November': 11, 'December': 12
        };

        const MONTH_NAMES = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 
                            'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

        function formatIndianNumber(num) {
            if (!num || num === 0) return '0';
            num = Math.round(num);
            let s = num.toString();
            if (s.length <= 3) return s;
            let result = s.slice(-3);
            s = s.slice(0, -3);
            while (s.length > 0) {
                result = s.slice(-2) + ',' + result;
                s = s.slice(0, -2);
            }
            return result;
        }

        function formatRupees(num) {
            return 'Rs. ' + formatIndianNumber(num);
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast active ' + type;
            setTimeout(() => toast.classList.remove('active'), 3000);
        }

        function parseDate(dateStr) {
            if (!dateStr) return null;
            const [year, month] = dateStr.split('-').map(Number);
            return { year, month };
        }

        function addMonths(date, months) {
            let year = date.year;
            let month = date.month + months;
            while (month > 12) {
                month -= 12;
                year++;
            }
            while (month < 1) {
                month += 12;
                year--;
            }
            return { year, month };
        }

        function formatMonthYear(date) {
            return MONTH_NAMES[date.month - 1] + ' ' + date.year;
        }

        function calculateLoan() {
            // Get values
            const landLoan = parseFloat(document.getElementById('land_loan').value) || 0;
            const constructionLoan = parseFloat(document.getElementById('construction_loan').value) || 0;
            const loanStartDate = document.getElementById('loan_start_date').value;
            const constructionStartDate = document.getElementById('construction_start_date').value;
            const emiAmount = parseFloat(document.getElementById('emi_amount').value) || 0;
            const interestRate = parseFloat(document.getElementById('interest_rate').value) || 7.54;

            // Validate
            if (landLoan <= 0 && constructionLoan <= 0) {
                showToast('Please enter a loan amount', 'error');
                return;
            }
            if (!loanStartDate) {
                showToast('Please select loan start date', 'error');
                return;
            }
            if (emiAmount <= 0) {
                showToast('Please enter EMI amount', 'error');
                return;
            }

            // Get part payments
            const partPayments = [];
            for (let i = 1; i <= 3; i++) {
                const month = document.getElementById(`pp_month_${i}`).value;
                const amount = parseFloat(document.getElementById(`pp_amount_${i}`).value) || 0;
                if (month && amount > 0) {
                    partPayments.push({ month, amount });
                }
            }

            // Show loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('previewSection').classList.remove('active');

            // Calculate
            setTimeout(() => {
                try {
                    const result = doCalculation(
                        landLoan, constructionLoan, loanStartDate, constructionStartDate,
                        emiAmount, interestRate, partPayments
                    );
                    
                    calculationResult = result;
                    
                    // Update UI
                    document.getElementById('result_closure').textContent = result.closure_date;
                    document.getElementById('result_tenure').textContent = result.tenure;
                    document.getElementById('result_principal').textContent = formatRupees(result.total_principal);
                    document.getElementById('result_interest').textContent = formatRupees(result.total_interest);
                    document.getElementById('result_total').textContent = formatRupees(result.total_paid);
                    document.getElementById('result_prepay').textContent = formatRupees(result.total_prepayments);
                    
                    document.getElementById('previewSection').classList.add('active');
                    showToast('Calculation complete!', 'success');
                    
                } catch (e) {
                    showToast('Error: ' + e.message, 'error');
                } finally {
                    document.getElementById('loading').classList.remove('active');
                }
            }, 500);
        }

        function doCalculation(landLoan, constructionLoan, loanStartDate, constructionStartDate,
                              emiAmount, interestRate, partPayments) {
            const startDate = parseDate(loanStartDate);
            const constructionDate = parseDate(constructionStartDate);
            const monthlyRate = interestRate / 100 / 12;
            
            // Build prepay schedule
            const prepaySchedule = {};
            for (const pp of partPayments) {
                const monthNum = MONTH_MAP[pp.month];
                if (monthNum) {
                    prepaySchedule[monthNum] = (prepaySchedule[monthNum] || 0) + pp.amount;
                }
            }
            
            const monthlySchedule = [];
            let openingBalance = 0;
            let monthNumber = 0;
            let totalInterest = 0;
            let totalEmi = 0;
            let totalPrepay = 0;
            const totalPrincipal = landLoan + constructionLoan;
            
            let currentDate = { ...startDate };
            const maxMonths = 360;
            
            while (monthNumber < maxMonths) {
                monthNumber++;
                const monthName = formatMonthYear(currentDate);
                const monthNum = currentDate.month;
                
                // Disbursal
                let disbursal = 0;
                if (monthNumber === 1) {
                    disbursal = landLoan;
                }
                if (constructionDate && currentDate.year === constructionDate.year && 
                    currentDate.month === constructionDate.month) {
                    disbursal += constructionLoan;
                }
                
                // Interest
                const balanceForInterest = openingBalance + disbursal;
                const interest = balanceForInterest * monthlyRate;
                
                // EMI
                let emi = 0;
                if (monthNumber > 1) {
                    emi = Math.min(emiAmount, openingBalance + disbursal + interest);
                }
                
                // Prepayment
                let prepay = 0;
                if (prepaySchedule[monthNum] && monthNumber > 1) {
                    const remaining = openingBalance + disbursal + interest - emi;
                    if (remaining > 0) {
                        prepay = Math.min(prepaySchedule[monthNum], remaining);
                    }
                }
                
                // Closing balance
                let closingBalance = openingBalance + disbursal + interest - emi - prepay;
                if (closingBalance < 0) closingBalance = 0;
                
                monthlySchedule.push({
                    month_number: monthNumber,
                    month_name: monthName,
                    opening: openingBalance,
                    interest: interest,
                    disbursal: disbursal,
                    emi: emi,
                    prepay: prepay,
                    closing: closingBalance
                });
                
                totalInterest += interest;
                totalEmi += emi;
                totalPrepay += prepay;
                
                if (closingBalance <= 0 && monthNumber > 1) break;
                
                openingBalance = closingBalance;
                currentDate = addMonths(currentDate, 1);
            }
            
            const years = Math.floor(monthNumber / 12);
            const months = monthNumber % 12;
            const tenure = years > 0 ? `${years}y ${months}m` : `${months} months`;
            
            const closureDate = addMonths(startDate, monthNumber - 1);
            
            return {
                monthly_schedule: monthlySchedule,
                total_principal: totalPrincipal,
                total_interest: Math.round(totalInterest),
                total_paid: Math.round(totalEmi + totalPrepay),
                total_emi: Math.round(totalEmi),
                total_prepayments: Math.round(totalPrepay),
                tenure: tenure,
                tenure_months: monthNumber,
                closure_date: formatMonthYear(closureDate),
                start_date: formatMonthYear(startDate),
                land_loan: landLoan,
                construction_loan: constructionLoan,
                emi_amount: emiAmount,
                interest_rate: interestRate,
                part_payments: partPayments
            };
        }

        function generatePDF() {
            if (!calculationResult) {
                showToast('Please calculate first', 'error');
                return;
            }
            
            // Check if running in Android WebView
            if (typeof Android !== 'undefined' && Android.generatePDF) {
                showToast('Generating PDF...', 'info');
                Android.generatePDF(JSON.stringify(calculationResult));
            } else {
                showToast('PDF generation requires the Android app', 'error');
            }
        }

        // Set default date
        document.addEventListener('DOMContentLoaded', function() {
            const today = new Date();
            today.setMonth(today.getMonth() + 1);
            const defaultDate = today.toISOString().slice(0, 7);
            document.getElementById('loan_start_date').value = defaultDate;
        });
    </script>
</body>
</html>
